services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp_password
      POSTGRES_DB: whatsapp_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8081:8080"
    environment:
      - REDIS_ENABLED=false
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=morningstar
      - N8N_BASIC_AUTH_PASSWORD=morningstar_n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=whatsapp_bot
      - DB_POSTGRESDB_USER=whatsapp
      - DB_POSTGRESDB_PASSWORD=whatsapp_password
      - N8N_HOST=0.0.0.0
      - WEBHOOK_URL=http://n8n:5678
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  brain:
    build:
      context: ./brain
    restart: always
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      evolution-api:
        condition: service_started

volumes:
  postgres_data:
  evolution_instances:
  n8n_data:
